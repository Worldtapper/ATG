<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ATG — Blueprint Preloader Test</title>
<style>
/* ============================================================
   ATG METAL FABRICATIONS & INTERIORS — BLUEPRINT PRELOADER
   ============================================================ */
:root {
  --black: #010102;
  --cream: #FCE7CC;
  --gold: #F4D194;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-luxe: cubic-bezier(0.65, 0, 0.15, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.1, 1);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { 
    background: var(--black); 
    color: var(--cream); 
    overflow: hidden; 
}

#preloader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 1.2s var(--ease-soft);
}

/* Exit Animation */
#preloader.is-exiting {
    opacity: 0;
    filter: blur(18px);
    transform: scale(1.05);
    pointer-events: none;
}

/* ============================================================
   PRELOADER 03 — CONSTRUCTION PROCESS (blueprint → logo)
   ============================================================ */
.v {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.v3 .bp-grid {
    position: absolute;
    inset: -3%;
    opacity: 0;
    transform: scale(1.045);
    background-image:
        linear-gradient(rgba(252,231,204,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(252,231,204,0.05) 1px, transparent 1px),
        linear-gradient(rgba(252,231,204,0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(252,231,204,0.09) 1px, transparent 1px);
    background-size: 26px 26px, 26px 26px, 130px 130px, 130px 130px;
    animation: v3grid 1.1s var(--ease-out) 0.05s forwards;
}

@keyframes v3grid {
    to { opacity: 1; transform: scale(1); }
}

.v3-svg {
    width: min(86vw, 660px);
    height: auto;
    display: block;
    z-index: 1;
}

.v3 .sl {
    stroke: rgba(252,231,204,0.75);
    stroke-width: 1.4;
    fill: none;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 0.7s var(--ease-luxe) forwards;
}

@keyframes draw {
    to { stroke-dashoffset: 0; }
}

@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes ndIn {
    to { opacity: 1; transform: scale(1); }
}

@keyframes wmIn {
    to { opacity: 1; filter: blur(0); }
}

.v3 .col { animation-delay: 0.3s; }
.v3 .beam { animation-delay: 0.55s; }
.v3 .brace { animation-delay: 0.8s; }

.v3 .cd {
    stroke: rgba(252,231,204,0.3);
    stroke-width: 1;
    fill: none;
    stroke-dasharray: 5 6;
    opacity: 0;
    animation: fadeIn 0.7s 0.7s forwards;
}

.v3 .jn circle {
    fill: var(--gold);
    opacity: 0;
    transform: scale(0);
    transform-box: fill-box;
    transform-origin: center;
    animation: ndIn 0.4s var(--ease-out) forwards;
}

.v3 .j1 { animation-delay: 1.05s; }
.v3 .j2 { animation-delay: 1.10s; }
.v3 .j3 { animation-delay: 1.15s; }
.v3 .j4 { animation-delay: 1.20s; }
.v3 .j5 { animation-delay: 1.25s; }
.v3 .j6 { animation-delay: 1.30s; }

.v3 .st {
    transform-box: fill-box;
    transform-origin: center;
    animation: v3st 0.55s var(--ease-soft) 1.4s forwards;
}

@keyframes v3st {
    to { opacity: 0; transform: scale(0.965); }
}

.v3 .lt {
    stroke: var(--cream);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 0.65s var(--ease-luxe) forwards;
}

.v3 .l1 { animation-delay: 1.35s; }
.v3 .l2 { animation-delay: 1.5s; }
.v3 .l3 { animation-delay: 1.65s; }

.v3 .nd {
    fill: var(--gold);
    opacity: 0;
    transform: scale(0);
    transform-box: fill-box;
    transform-origin: center;
    animation: ndIn 0.4s var(--ease-out) forwards;
}

.v3 .n1 { animation-delay: 2.15s; }
.v3 .n2 { animation-delay: 2.2s; }
.v3 .n3 { animation-delay: 2.25s; }

.v3 .lbl {
    position: absolute;
    font: 9px var(--mono);
    letter-spacing: 0.22em;
    color: rgba(252,231,204,0.32);
    white-space: nowrap;
    opacity: 0;
    animation: fadeIn 0.8s forwards;
}

.v3 .la { top: 26px; left: 30px; animation-delay: 0.5s; }
.v3 .lb { top: 26px; right: 30px; animation-delay: 0.65s; }
.v3 .lc { bottom: 26px; right: 30px; animation-delay: 0.8s; }
.v3 .ld { bottom: 58px; left: 30px; animation-delay: 0.95s; }

.v3-word {
    position: absolute;
    bottom: 9vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    font-size: 10.5px;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: rgba(252,231,204,0.55);
    white-space: nowrap;
    opacity: 0;
    filter: blur(5px);
    animation: wmIn 0.8s var(--ease-out) 2s forwards;
}

/* Simulated Homepage content */
#site {
    opacity: 0;
    transition: opacity 1s ease 1s;
    padding: 50px;
    text-align: center;
    font-family: sans-serif;
}
#site.revealed {
    opacity: 1;
}
</style>
</head>
<body>

<div id="site">
    <h1>Welcome to ATG</h1>
    <p>The preloader has finished.</p>
</div>

<div id="preloader" class="v3">
    <div class="v v3">
        <div class="bp-grid"></div>
        <span class="lbl la">ATG &middot; STRUCTURAL SERIES</span>
        <span class="lbl lb">SCALE 1 : 50</span>
        <span class="lbl lc">N 25&deg; 12&prime; &mdash; E 55&deg; 16&prime;</span>
        <span class="lbl ld">DWG NO. ATG-03</span>
        <svg class="v3-svg" viewBox="0 0 900 560" fill="none" aria-hidden="true">
            <g class="st">
                <path class="sl col" d="M250 420 V160 M450 420 V160 M650 420 V160" pathLength="1"/>
                <path class="sl beam" d="M250 160 H650 M250 290 H650" pathLength="1"/>
                <path class="sl brace" d="M250 420 L450 160" pathLength="1"/>
                <path class="cd" d="M210 160 V420 M250 120 H650"/>
                <g class="jn">
                    <circle class="j1" cx="250" cy="160" r="3.5"/><circle class="j2" cx="450" cy="160" r="3.5"/>
                    <circle class="j3" cx="650" cy="160" r="3.5"/><circle class="j4" cx="250" cy="420" r="3.5"/>
                    <circle class="j5" cx="450" cy="420" r="3.5"/><circle class="j6" cx="650" cy="420" r="3.5"/>
                </g>
            </g>
            
            <!-- ATG_PATHS injected here -->
            <path class="lt l1" d="M270 340 L330 190 L390 340 M293 282 L367 282" pathLength="1"/>
            <path class="lt l2" d="M450 190 V340 M395 190 H505" pathLength="1"/>
            <path class="lt l3" d="M640 232 C634 202 608 188 580 188 C532 188 512 224 512 266 C512 310 536 342 580 342 C620 342 640 318 640 288 V276 H594" pathLength="1"/>
            
            <circle class="nd n1" cx="330" cy="190" r="3.5"/>
            <circle class="nd n2" cx="505" cy="190" r="3.5"/>
            <circle class="nd n3" cx="594" cy="276" r="3.5"/>
        </svg>
        <div class="v3-word">METAL FABRICATIONS &amp; INTERIORS</div>
    </div>
</div>

<script>
    // Simulate preloader duration and exit
    document.addEventListener("DOMContentLoaded", function() {
        const preloader = document.getElementById('preloader');
        const site = document.getElementById('site');
        
        // Wait for animations to finish, then exit (2.85s based on original config)
        setTimeout(() => {
            preloader.classList.add('is-exiting');
            site.classList.add('revealed');
            
            // Remove from DOM after exit transition
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 1000);
        }, 3200); // 3.2 seconds lets you see the whole animation
    });
</script>

</body>
</html>
