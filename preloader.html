<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ATG — Metal Fabrications &amp; Interiors · Preloader Concepts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23010102'/%3E%3Crect x='11' y='11' width='10' height='10' fill='%23F4D194'/%3E%3C/svg%3E"/>
<style>
/* ============================================================
   ATG METAL FABRICATIONS & INTERIORS — 4 PRELOADER CONCEPTS
   Pure HTML / CSS / Vanilla JS. No libraries.
   ============================================================ */
:root{
  --black:#010102;
  --cream:#FCE7CC;
  --gold:#F4D194;
  --gold-deep:#B98F4E;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --ease-luxe:cubic-bezier(0.65,0,0.15,1);
  --ease-heavy:cubic-bezier(0.77,0,0.18,1);
  --ease-soft:cubic-bezier(0.4,0,0.1,1);
  --serif:"Didot","Bodoni MT","Playfair Display","Times New Roman",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--black);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
::selection{background:var(--gold);color:var(--black)}

/* ============================================================
   HOMEPAGE (demo canvas revealed beneath every preloader)
   ============================================================ */
#site{position:relative;min-height:100vh;display:flex;flex-direction:column}
.bg-lines{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(90deg,rgba(252,231,204,0.032) 1px,transparent 1px);
  background-size:calc(100%/6) 100%;opacity:0;transition:opacity 1.6s var(--ease-soft) 0.35s}
.glow{position:fixed;top:-32vh;left:50%;transform:translateX(-50%);width:96vw;height:64vh;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center,rgba(252,231,204,0.05),transparent 65%);
  opacity:0;transition:opacity 1.8s var(--ease-soft) 0.2s}
#site.revealed .bg-lines,#site.revealed .glow{opacity:1}

.rv{opacity:0;transform:translateY(28px);filter:blur(10px);
  transition:opacity 1.1s var(--ease-out),transform 1.1s var(--ease-out),filter 1.1s var(--ease-out);
  transition-delay:var(--d,0s)}
#site.revealed .rv{opacity:1;transform:translateY(0);filter:blur(0)}

nav{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;
  padding:30px clamp(24px,4.5vw,56px)}
.brand{display:flex;align-items:center;gap:13px;font-family:var(--serif);font-size:19px;letter-spacing:0.3em}
.brand i{width:7px;height:7px;background:var(--gold);display:block}
.nav-links{display:flex;gap:clamp(18px,3vw,42px)}
.nav-links a{font-size:10px;letter-spacing:0.26em;color:rgba(252,231,204,0.55);text-decoration:none;transition:color 0.4s}
.nav-links a:hover{color:var(--gold)}

.hero{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px}
.hero-kicker{display:flex;align-items:center;gap:18px;font-size:10px;letter-spacing:0.44em;color:rgba(252,231,204,0.5)}
.hero-kicker::before,.hero-kicker::after{content:"";width:46px;height:1px}
.hero-kicker::before{background:linear-gradient(90deg,transparent,rgba(244,209,148,0.6))}
.hero-kicker::after{background:linear-gradient(90deg,rgba(244,209,148,0.6),transparent)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(120px,25vw,300px);line-height:0.95;letter-spacing:0.06em;
  margin:24px 0 6px;background:linear-gradient(180deg,#fdf3e3 0%,#d9c9ab 70%,#a6987f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:11px;letter-spacing:0.34em;color:rgba(252,231,204,0.45);margin-top:20px}
.hero-tag{font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.7vw,19px);color:rgba(252,231,204,0.62);margin-top:30px}
.cta{margin-top:46px;display:inline-block;padding:16px 44px;border:1px solid rgba(252,231,204,0.25);
  font-size:10px;letter-spacing:0.3em;color:var(--cream);text-decoration:none;transition:all 0.5s var(--ease-out)}
.cta:hover{background:var(--cream);color:var(--black);border-color:var(--cream)}
.foot{position:relative;z-index:2;display:flex;justify-content:space-between;gap:16px;
  padding:0 clamp(24px,4.5vw,56px) 34px;font-size:9px;letter-spacing:0.26em;color:rgba(252,231,204,0.3)}

/* ============================================================
   PRELOADER SHELL
   ============================================================ */
#preloader{position:fixed;inset:0;z-index:200;background:var(--black);
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.v{display:none;position:absolute;inset:0;align-items:center;justify-content:center}
#preloader.v1 .v1,#preloader.v2 .v2,#preloader.v3 .v3,#preloader.v4 .v4{display:flex}

#pl-tag{position:absolute;left:34px;bottom:30px;z-index:5;display:flex;gap:10px;align-items:center;
  font:9px var(--mono);letter-spacing:0.3em;color:rgba(252,231,204,0.4);mix-blend-mode:difference}
#pl-tag i{font-style:normal;color:rgba(244,209,148,0.85)}

/* Shared keyframes */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes wmIn{to{opacity:1;filter:blur(0)}}
@keyframes ndIn{to{opacity:1;transform:scale(1)}}

/* Global exit — variants 01 & 03: cinematic fade / scale / blur */
#preloader.v1,#preloader.v3{
  transition:opacity 0.9s var(--ease-soft) 0.05s,filter 0.9s var(--ease-soft) 0.05s,transform 0.9s var(--ease-soft) 0.05s}
#preloader.v1.is-exiting,#preloader.v3.is-exiting{opacity:0;filter:blur(18px);transform:scale(1.05);pointer-events:none}
#preloader.is-exiting{cursor:default}

/* ============================================================
   PRELOADER 01 — PRECISION ENGINEERING (self-drawing lines)
   ============================================================ */
.v1::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,rgba(252,231,204,0.045),transparent 62%)}
.v1-svg{width:min(84vw,640px);height:auto;display:block;animation:v1zoom 2.7s var(--ease-soft) both}
@keyframes v1zoom{from{transform:scale(0.99)}to{transform:scale(1.015)}}
.v1 .fr{stroke:rgba(252,231,204,0.5);stroke-width:1;fill:none;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 1.2s var(--ease-luxe) 0.15s forwards}
.v1 .dm{stroke:rgba(252,231,204,0.35);stroke-width:1;fill:none;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 1s var(--ease-luxe) 0.3s forwards}
.v1 .dmt{fill:rgba(252,231,204,0.4);font:10px var(--mono);letter-spacing:2px;text-anchor:middle;
  opacity:0;animation:fadeIn 0.6s 0.85s forwards}
.v1 .cr{stroke:var(--gold);stroke-width:1.1;fill:none;opacity:0;transform:scale(0.4);
  transform-box:fill-box;transform-origin:center;animation:crIn 0.5s var(--ease-out) forwards}
@keyframes crIn{to{opacity:0.9;transform:scale(1)}}
.v1 .cr1{animation-delay:0.35s}.v1 .cr2{animation-delay:0.45s}.v1 .cr3{animation-delay:0.55s}.v1 .cr4{animation-delay:0.65s}
.v1 .lt{stroke:var(--cream);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.8s var(--ease-luxe) forwards}
.v1 .l1{animation-delay:0.5s}.v1 .l2{animation-delay:0.72s}.v1 .l3{animation-delay:0.94s}
.v1 .nd{fill:var(--gold);opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;
  animation:ndIn 0.45s var(--ease-out) forwards}
.v1 .n1{animation-delay:1.45s}.v1 .n2{animation-delay:1.51s}.v1 .n3{animation-delay:1.57s}
.v1 .n4{animation-delay:1.63s}.v1 .n5{animation-delay:1.69s}
.v1 .base{stroke:var(--gold);stroke-width:1;fill:none;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 0.7s var(--ease-luxe) 1.5s forwards}
.v1 .wm{fill:rgba(252,231,204,0.55);font:12.5px var(--sans);letter-spacing:5px;text-anchor:middle;
  opacity:0;filter:blur(6px);animation:wmIn 0.8s var(--ease-out) 1.7s forwards}
.v1 .sq{fill:var(--gold);opacity:0;transform:scale(0) rotate(45deg);transform-box:fill-box;transform-origin:center;
  animation:sqIn 0.5s var(--ease-out) 1.8s forwards}
@keyframes sqIn{to{opacity:1;transform:scale(1) rotate(0deg)}}

/* ============================================================
   PRELOADER 02 — LUXURY MATERIALS (weighted metallic panels)
   ============================================================ */
.v2{display:block}
.v2 .p{position:absolute;top:-1px;bottom:-1px;width:calc(100%/6 + 1px);will-change:transform;
  background:linear-gradient(165deg,#19191d 0%,#0c0c0f 38%,#121215 55%,#08080a 100%);
  box-shadow:inset 0 0 90px rgba(0,0,0,0.6);
  animation:v2in 0.95s var(--ease-luxe) both}
.v2 .p::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,0.014) 0 1px,transparent 1px 4px)}
.v2 .p1{left:0;--f:-101%;animation-delay:0.05s}
.v2 .p2{left:calc(100%/6);--f:101%;animation-delay:0.12s}
.v2 .p3{left:calc(200%/6);--f:-101%;animation-delay:0.19s;border-right:1px solid rgba(244,209,148,0.28)}
.v2 .p4{left:calc(300%/6);--f:101%;animation-delay:0.26s;border-left:1px solid rgba(244,209,148,0.28)}
.v2 .p5{left:calc(400%/6);--f:-101%;animation-delay:0.33s}
.v2 .p6{left:calc(500%/6);--f:101%;animation-delay:0.40s}
@keyframes v2in{from{transform:translateY(var(--f))}to{transform:translateY(0)}}
.v2 .sheen{position:absolute;top:-20%;left:0;width:100%;height:140%;pointer-events:none;
  background:linear-gradient(100deg,transparent 42%,rgba(252,231,204,0.055) 50%,transparent 58%);
  transform:translateX(-110%);animation:v2sheen 1.3s var(--ease-soft) 1.05s both}
@keyframes v2sheen{to{transform:translateX(110%)}}
.v2-logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:2}
.v2-atg{font-family:var(--serif);font-size:clamp(58px,9.5vw,118px);line-height:1;color:transparent;
  background:linear-gradient(180deg,#fdf4e4 0%,#ecdcbe 38%,#a2937b 50%,#e8d6b8 62%,#faf0de 100%);
  -webkit-background-clip:text;background-clip:text;
  opacity:0;filter:blur(12px);transform:scale(0.97);letter-spacing:0.48em;text-indent:0.48em;
  animation:v2logo 1.1s var(--ease-out) 0.8s forwards}
@keyframes v2logo{to{opacity:1;filter:blur(0);transform:scale(1);letter-spacing:0.2em;text-indent:0.2em}}
.v2-rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:v2rule 0.8s var(--ease-luxe) 1.5s forwards}
@keyframes v2rule{to{width:76px}}
.v2-sub{font-size:10.5px;letter-spacing:0.42em;text-indent:0.42em;color:rgba(252,231,204,0.5);
  white-space:nowrap;opacity:0;animation:fadeIn 0.8s var(--ease-out) 1.6s forwards}
/* Exit: panels part like weighted doors, centre outward */
#preloader.v2.is-exiting{background:transparent;transition:background-color 0.25s}
#preloader.v2.is-exiting .v2 .p{animation:none;transition:transform 1s var(--ease-luxe)}
#preloader.v2.is-exiting .p1{transform:translateX(-75vw);transition-delay:0.14s}
#preloader.v2.is-exiting .p2{transform:translateX(-75vw);transition-delay:0.07s}
#preloader.v2.is-exiting .p3{transform:translateX(-75vw);transition-delay:0s}
#preloader.v2.is-exiting .p4{transform:translateX(75vw);transition-delay:0s}
#preloader.v2.is-exiting .p5{transform:translateX(75vw);transition-delay:0.07s}
#preloader.v2.is-exiting .p6{transform:translateX(75vw);transition-delay:0.14s}
#preloader.v2.is-exiting .v2-logo{opacity:0;filter:blur(8px);transform:scale(1.03);transition:all 0.45s var(--ease-soft)}
#preloader.v2.is-exiting .sheen{opacity:0;transition:opacity 0.3s}

/* ============================================================
   PRELOADER 03 — CONSTRUCTION PROCESS (blueprint → logo)
   ============================================================ */
.v3 .bp-grid{position:absolute;inset:-3%;opacity:0;transform:scale(1.045);
  background-image:
    linear-gradient(rgba(252,231,204,0.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(252,231,204,0.05) 1px,transparent 1px),
    linear-gradient(rgba(252,231,204,0.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(252,231,204,0.09) 1px,transparent 1px);
  background-size:26px 26px,26px 26px,130px 130px,130px 130px;
  animation:v3grid 1.1s var(--ease-out) 0.05s forwards}
@keyframes v3grid{to{opacity:1;transform:scale(1)}}
.v3-svg{width:min(86vw,660px);height:auto;display:block;z-index:1}
.v3 .sl{stroke:rgba(252,231,204,0.75);stroke-width:1.4;fill:none;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.7s var(--ease-luxe) forwards}
.v3 .col{animation-delay:0.3s}.v3 .beam{animation-delay:0.55s}.v3 .brace{animation-delay:0.8s}
.v3 .cd{stroke:rgba(252,231,204,0.3);stroke-width:1;fill:none;stroke-dasharray:5 6;
  opacity:0;animation:fadeIn 0.7s 0.7s forwards}
.v3 .jn circle{fill:var(--gold);opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;
  animation:ndIn 0.4s var(--ease-out) forwards}
.v3 .j1{animation-delay:1.05s}.v3 .j2{animation-delay:1.10s}.v3 .j3{animation-delay:1.15s}
.v3 .j4{animation-delay:1.20s}.v3 .j5{animation-delay:1.25s}.v3 .j6{animation-delay:1.30s}
.v3 .st{transform-box:fill-box;transform-origin:center;
  animation:v3st 0.55s var(--ease-soft) 1.4s forwards}
@keyframes v3st{to{opacity:0;transform:scale(0.965)}}
.v3 .lt{stroke:var(--cream);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 0.65s var(--ease-luxe) forwards}
.v3 .l1{animation-delay:1.35s}.v3 .l2{animation-delay:1.5s}.v3 .l3{animation-delay:1.65s}
.v3 .nd{fill:var(--gold);opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;
  animation:ndIn 0.4s var(--ease-out) forwards}
.v3 .n1{animation-delay:2.15s}.v3 .n2{animation-delay:2.2s}.v3 .n3{animation-delay:2.25s}
.v3 .lbl{position:absolute;font:9px var(--mono);letter-spacing:0.22em;color:rgba(252,231,204,0.32);
  white-space:nowrap;opacity:0;animation:fadeIn 0.8s forwards}
.v3 .la{top:26px;left:30px;animation-delay:0.5s}
.v3 .lb{top:26px;right:30px;animation-delay:0.65s}
.v3 .lc{bottom:26px;right:30px;animation-delay:0.8s}
.v3 .ld{bottom:58px;left:30px;animation-delay:0.95s}
.v3-word{position:absolute;bottom:9vh;left:50%;transform:translateX(-50%);z-index:1;
  font-size:10.5px;letter-spacing:0.42em;text-indent:0.42em;color:rgba(252,231,204,0.55);
  white-space:nowrap;opacity:0;filter:blur(5px);animation:wmIn 0.8s var(--ease-out) 2s forwards}

/* ============================================================
   PRELOADER 04 — PREMIUM INTERIOR REVEAL (partitions)
   ============================================================ */
.v4{display:block}
.v4 .pt{position:absolute;top:-2px;bottom:-2px;will-change:transform;
  box-shadow:0 0 70px rgba(0,0,0,0.28);
  animation:v4in 0.8s var(--ease-luxe) both}
.v4 .pt.cream{background:linear-gradient(180deg,#FCE7CC 0%,#F6DDBB 100%)}
.v4 .pt.dark{background:linear-gradient(180deg,#0d0d10 0%,#060608 100%)}
.v4 .pt1{left:0;width:calc(13% + 1px);--fx:-8vw;animation-delay:0s}
.v4 .pt2{left:13%;width:calc(20.5% + 1px);--fx:-6vw;animation-delay:0.05s}
.v4 .pt3{left:33.5%;width:calc(16.5% + 1px);--fx:-4vw;animation-delay:0.1s;border-right:1px solid rgba(185,143,78,0.5)}
.v4 .pt4{left:50%;width:calc(16.5% + 1px);--fx:4vw;animation-delay:0.1s}
.v4 .pt5{left:70.5%;width:calc(20.5% + 1px);--fx:6vw;animation-delay:0.05s}
.v4 .pt6{left:91%;width:calc(13% + 2px);--fx:8vw;animation-delay:0s}
@keyframes v4in{from{transform:translateX(var(--fx));filter:blur(4px);opacity:0.55}
  to{transform:translateX(0);filter:blur(0);opacity:1}}
.v4-logo{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.v4-atg{font-family:var(--serif);font-size:clamp(52px,8vw,96px);line-height:1;color:#0b0b0d;
  letter-spacing:0.22em;text-indent:0.22em;
  opacity:0;filter:blur(14px);transform:scale(0.975);
  animation:v4logo 1s var(--ease-out) 0.55s forwards}
@keyframes v4logo{to{opacity:1;filter:blur(0);transform:scale(1)}}
.v4-rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-deep),transparent);
  animation:v2rule 0.8s var(--ease-luxe) 0.85s forwards}
.v4-sub{font-size:10px;letter-spacing:0.4em;text-indent:0.4em;color:rgba(1,1,2,0.55);
  white-space:nowrap;opacity:0;animation:fadeIn 1s 0.95s forwards}
/* Exit: partitions glide apart, calm and expensive */
#preloader.v4.is-exiting{background:transparent;transition:background-color 0.3s}
#preloader.v4.is-exiting .v4 .pt{animation:none;transition:transform 1.1s var(--ease-heavy)}
#preloader.v4.is-exiting .pt1{transform:translateX(-80vw);transition-delay:0.12s}
#preloader.v4.is-exiting .pt2{transform:translateX(-80vw);transition-delay:0.06s}
#preloader.v4.is-exiting .pt3{transform:translateX(-80vw);transition-delay:0s}
#preloader.v4.is-exiting .pt4{transform:translateX(80vw);transition-delay:0s}
#preloader.v4.is-exiting .pt5{transform:translateX(80vw);transition-delay:0.06s}
#preloader.v4.is-exiting .pt6{transform:translateX(80vw);transition-delay:0.12s}
#preloader.v4.is-exiting .v4-logo{opacity:0;transform:scale(0.96);filter:blur(10px);transition:all 0.5s var(--ease-soft)}

/* ============================================================
   CONCEPT SWITCHER
   ============================================================ */
#picker{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);z-index:300;
  display:flex;align-items:center;gap:4px;padding:6px;
  background:rgba(8,8,10,0.68);border:1px solid rgba(252,231,204,0.13);border-radius:999px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity 0.7s var(--ease-out),transform 0.7s var(--ease-out)}
#picker.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pk-label{font:8.5px var(--mono);letter-spacing:0.28em;color:rgba(252,231,204,0.32);padding:0 12px 0 16px;white-space:nowrap}
#picker button{appearance:none;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;
  font:10px var(--sans);letter-spacing:0.14em;color:rgba(252,231,204,0.5);
  padding:9px 13px;border-radius:999px;transition:all 0.35s}
#picker button em{font-style:normal;font-size:8.5px;letter-spacing:0.22em;color:rgba(252,231,204,0.28);transition:color 0.35s}
#picker button:hover{color:var(--cream)}
#picker button.on{background:rgba(244,209,148,0.13);color:var(--gold)}
#picker button.on em{color:rgba(244,209,148,0.6)}
#picker .pk-sep{width:1px;height:16px;background:rgba(252,231,204,0.12);margin:0 4px}
#picker #pk-replay{font-size:13px;padding:9px 12px;line-height:1}

/* ============================================================
   RESPONSIVE + ACCESSIBILITY
   ============================================================ */
@media (max-width:720px){
  .nav-links a:nth-child(n+3){display:none}
  #picker button em{display:none}
  .pk-label{display:none}
  .foot span:nth-child(2){display:none}
  .v3 .lc,.v3 .ld{display:none}
  #pl-tag{left:20px;bottom:20px}
  .v3 .la{top:18px;left:18px}.v3 .lb{top:18px;right:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-delay:0s !important;
    transition-duration:0.25s !important;transition-delay:0s !important}
}
</style>
</head>
<body>

  <!-- ============ HOMEPAGE ============ -->
  <main id="site" aria-hidden="true">
    <div class="bg-lines"></div>
    <div class="glow"></div>
    <nav class="rv" style="--d:.05s">
      <div class="brand"><i></i>ATG</div>
      <div class="nav-links">
        <a href="#">FABRICATION</a><a href="#">INTERIORS</a><a href="#">PROJECTS</a><a href="#">CONTACT</a>
      </div>
    </nav>
    <section class="hero">
      <div class="hero-kicker rv" style="--d:.15s">METAL FABRICATIONS &amp; INTERIORS</div>
      <h1 class="rv" style="--d:.25s">ATG</h1>
      <div class="hero-sub rv" style="--d:.4s">PRECISION METALWORK — BESPOKE INTERIORS</div>
      <div class="hero-tag rv" style="--d:.5s">Precision in metal. Poetry in space.</div>
      <a class="cta rv" style="--d:.62s" href="#">VIEW PROJECTS</a>
    </section>
    <div class="foot rv" style="--d:.72s">
      <span>EST. MMXI</span><span>DUBAI · LONDON · MILAN</span><span>SCROLL</span>
    </div>
  </main>

  <!-- ============ PRELOADER ============ -->
  <div id="preloader" class="v1">
    <div id="pl-stage"></div>
    <div id="pl-tag"><span id="pl-tag-num">01</span><i>/</i><span id="pl-tag-name">PRECISION ENGINEERING</span></div>
  </div>

  <!-- ============ CONCEPT SWITCHER ============ -->
  <div id="picker" role="group" aria-label="Preloader concept switcher">
    <span class="pk-label">PRELOADER</span>
    <button data-v="1" class="on" aria-pressed="true"><b>01</b><em>PRECISION</em></button>
    <button data-v="2" aria-pressed="false"><b>02</b><em>MATERIAL</em></button>
    <button data-v="3" aria-pressed="false"><b>03</b><em>BLUEPRINT</em></button>
    <button data-v="4" aria-pressed="false"><b>04</b><em>REVEAL</em></button>
    <span class="pk-sep"></span>
    <button id="pk-replay" title="Replay (R)">&#8635;</button>
  </div>

<script>
(function(){
"use strict";

/* ---------- Variant markup (rebuilt on every run = clean restarts) ---------- */
var ATG_PATHS =
  '<path class="lt l1" d="M270 340 L330 190 L390 340 M293 282 L367 282" pathLength="1"/>' +
  '<path class="lt l2" d="M450 190 V340 M395 190 H505" pathLength="1"/>' +
  '<path class="lt l3" d="M640 232 C634 202 608 188 580 188 C532 188 512 224 512 266 C512 310 536 342 580 342 C620 342 640 318 640 288 V276 H594" pathLength="1"/>';

var TPL = {
  1: function(){
    return '<div class="v v1">' +
      '<svg class="v1-svg" viewBox="0 0 900 560" fill="none" aria-hidden="true">' +
        '<path class="dm" d="M60 40 H840 M60 33 V47 M840 33 V47" pathLength="1"/>' +
        '<text class="dmt" x="450" y="28">900.00</text>' +
        '<rect class="fr" x="60" y="60" width="780" height="440" pathLength="1"/>' +
        '<path class="cr cr1" d="M60 45 V75 M45 60 H75" pathLength="1"/>' +
        '<path class="cr cr2" d="M840 45 V75 M825 60 H855" pathLength="1"/>' +
        '<path class="cr cr3" d="M60 485 V515 M45 500 H75" pathLength="1"/>' +
        '<path class="cr cr4" d="M840 485 V515 M825 500 H855" pathLength="1"/>' +
        ATG_PATHS +
        '<circle class="nd n1" cx="330" cy="190" r="3.5"/>' +
        '<circle class="nd n2" cx="395" cy="190" r="3.5"/>' +
        '<circle class="nd n3" cx="505" cy="190" r="3.5"/>' +
        '<circle class="nd n4" cx="580" cy="188" r="3.5"/>' +
        '<circle class="nd n5" cx="594" cy="276" r="3.5"/>' +
        '<path class="base" d="M250 402 H650" pathLength="1"/>' +
        '<text class="wm" x="450" y="446">METAL FABRICATIONS &amp; INTERIORS</text>' +
        '<rect class="sq" x="821" y="481" width="14" height="14"/>' +
      '</svg>' +
    '</div>';
  },
  2: function(){
    return '<div class="v v2">' +
      '<div class="p p1"></div><div class="p p2"></div><div class="p p3"></div>' +
      '<div class="p p4"></div><div class="p p5"></div><div class="p p6"></div>' +
      '<div class="sheen"></div>' +
      '<div class="v2-logo">' +
        '<div class="v2-atg">ATG</div>' +
        '<div class="v2-rule"></div>' +
        '<div class="v2-sub">METAL FABRICATIONS &amp; INTERIORS</div>' +
      '</div>' +
    '</div>';
  },
  3: function(){
    return '<div class="v v3">' +
      '<div class="bp-grid"></div>' +
      '<span class="lbl la">ATG &middot; STRUCTURAL SERIES</span>' +
      '<span class="lbl lb">SCALE 1 : 50</span>' +
      '<span class="lbl lc">N 25&deg; 12&prime; &mdash; E 55&deg; 16&prime;</span>' +
      '<span class="lbl ld">DWG NO. ATG-03</span>' +
      '<svg class="v3-svg" viewBox="0 0 900 560" fill="none" aria-hidden="true">' +
        '<g class="st">' +
          '<path class="sl col" d="M250 420 V160 M450 420 V160 M650 420 V160" pathLength="1"/>' +
          '<path class="sl beam" d="M250 160 H650 M250 290 H650" pathLength="1"/>' +
          '<path class="sl brace" d="M250 420 L450 160" pathLength="1"/>' +
          '<path class="cd" d="M210 160 V420 M250 120 H650"/>' +
          '<g class="jn">' +
            '<circle class="j1" cx="250" cy="160" r="3.5"/><circle class="j2" cx="450" cy="160" r="3.5"/>' +
            '<circle class="j3" cx="650" cy="160" r="3.5"/><circle class="j4" cx="250" cy="420" r="3.5"/>' +
            '<circle class="j5" cx="450" cy="420" r="3.5"/><circle class="j6" cx="650" cy="420" r="3.5"/>' +
          '</g>' +
        '</g>' +
        ATG_PATHS +
        '<circle class="nd n1" cx="330" cy="190" r="3.5"/>' +
        '<circle class="nd n2" cx="505" cy="190" r="3.5"/>' +
        '<circle class="nd n3" cx="594" cy="276" r="3.5"/>' +
      '</svg>' +
      '<div class="v3-word">METAL FABRICATIONS &amp; INTERIORS</div>' +
    '</div>';
  },
  4: function(){
    return '<div class="v v4">' +
      '<div class="pt pt1 cream"></div><div class="pt pt2 dark"></div><div class="pt pt3 cream"></div>' +
      '<div class="pt pt4 cream"></div><div class="pt pt5 dark"></div><div class="pt pt6 cream"></div>' +
      '<div class="v4-logo">' +
        '<div class="v4-atg">ATG</div>' +
        '<div class="v4-rule"></div>' +
        '<div class="v4-sub">METAL FABRICATIONS &amp; INTERIORS</div>' +
      '</div>' +
    '</div>';
  }
};

/* ---------- Orchestration ---------- */
var pre    = document.getElementById('preloader'),
    stage  = document.getElementById('pl-stage'),
    site   = document.getElementById('site'),
    picker = document.getElementById('picker'),
    tagNum = document.getElementById('pl-tag-num'),
    tagName= document.getElementById('pl-tag-name');

var NAMES = {1:'PRECISION ENGINEERING',2:'LUXURY MATERIALS',3:'CONSTRUCTION PROCESS',4:'PREMIUM INTERIOR REVEAL'};
/* dur    = hold before exit begins
   reveal = homepage entrance begins
   gone   = preloader fully removed                                  */
var CFG = {
  1:{dur:2550, reveal:2550, gone:3560},
  2:{dur:2500, reveal:2520, gone:3660},
  3:{dur:2850, reveal:2850, gone:3860},
  4:{dur:1750, reveal:1950, gone:3050}
};

var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var qs = new URLSearchParams(location.search);
var FREEZE = qs.get('freeze') === '1';
var cur = parseInt(qs.get('v'),10);
if(!(cur>=1 && cur<=4)) cur = 1;
var timers = [];

function clearTimers(){ for(var i=0;i<timers.length;i++) clearTimeout(timers[i]); timers=[]; }

function render(){
  stage.innerHTML = TPL[cur]();
  pre.className = 'v' + cur;
  tagNum.textContent = '0' + cur;
  tagName.textContent = NAMES[cur];
  var btns = picker.querySelectorAll('button[data-v]');
  for(var i=0;i<btns.length;i++){
    var on = +btns[i].getAttribute('data-v') === cur;
    btns[i].classList.toggle('on', on);
    btns[i].setAttribute('aria-pressed', on);
  }
}

function finish(){
  pre.style.display = 'none';
  document.body.classList.remove('locked');
  picker.classList.add('show');
  site.removeAttribute('aria-hidden');
}

function start(){
  clearTimers();
  render();
  pre.style.display = 'flex';
  pre.classList.remove('is-exiting');
  site.classList.remove('revealed');
  site.setAttribute('aria-hidden','true');
  document.body.classList.add('locked');
  picker.classList.remove('show');
  void pre.offsetWidth; /* reflow: restart transitions cleanly */

  if(RM){ /* reduced motion: skip the show, quick gentle fade */
    timers.push(setTimeout(function(){
      site.classList.add('revealed'); finish();
    }, 600));
    return;
  }
  if(FREEZE) return; /* QA mode: hold the final pose */

  var c = CFG[cur];
  timers.push(setTimeout(function(){ pre.classList.add('is-exiting'); }, c.dur));
  timers.push(setTimeout(function(){ site.classList.add('revealed'); site.removeAttribute('aria-hidden'); }, c.reveal));
  timers.push(setTimeout(finish, c.gone));
}

/* Click the preloader to skip forward */
pre.addEventListener('click', function(){
  if(pre.classList.contains('is-exiting') || pre.style.display === 'none') return;
  clearTimers();
  pre.classList.add('is-exiting');
  site.classList.add('revealed'); site.removeAttribute('aria-hidden');
  timers.push(setTimeout(finish, (cur===2||cur===4) ? 1250 : 1000));
});

/* Switcher */
picker.addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.id === 'pk-replay'){ start(); return; }
  var v = +b.getAttribute('data-v');
  if(v>=1 && v<=4){ cur = v; start(); }
});

/* Keyboard: 1–4 select, R replays */
document.addEventListener('keydown', function(e){
  if(e.key>='1' && e.key<='4'){ cur = +e.key; start(); }
  else if(e.key==='r' || e.key==='R'){ start(); }
});

start();
})();
</script>
</body>
